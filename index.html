                            Authorization: `Bearer ${supabaseAnonKey}`,
                            "Content-Type": "application/json",
                            Prefer: prefer
                        },
                        body: body ? JSON.stringify(body) : undefined
                    });
                    if (!response.ok) throw new Error(`${tableName} ${method} 失敗：${await response.text()}`);
                    if (response.status === 204) return null;
                    return response.json();
                };

                const productFromDb = (row) => ({
                    id: row.id,
                    name: row.name,
                    price: row.price || 0,
                    category: row.category || "未分類",
                    image: row.image_url || row.image || "",
                    isCombo: !!row.is_combo,
                    stock: row.stock || 0
                });

                const productToDb = (product) => ({
                    name: product.name,
                    price: product.price,
                    category: product.category,
                    image_url: product.image,
                    is_combo: !!product.isCombo,
                    stock: product.stock || 0
                });

                const customerFromDb = (row) => ({
                    id: row.id,
                    name: row.name,
                    phone: row.phone || "",
                    points: row.points || 0
                });

                const purchaseFromDb = (row) => ({
                    id: row.id,
                    date: row.purchase_date || row.created_at?.slice(0, 10) || "",
                    supplier: row.supplier || "",
                    productId: row.product_id,
                    productName: row.product_name || "",
                    unitPrice: row.unit_price || 0,
                    quantity: row.quantity || 0,
                    total: row.total || 0
                });

                const attendanceFromDb = (row) => ({
                    id: row.id,
                    name: row.employee_name,
                    time: row.created_at ? new Date(row.created_at).toLocaleString() : "",
                    type: row.action
                });

                const employeeFromDb = (row) => ({
                    id: row.id,
                    name: row.name,
                    role: row.role || "Staff",
                    status: row.status || "offline"
                });

                const loadSupabaseData = async (fallbackProducts, fallbackCustomers) => {
                    const dbProducts = await supabaseRequest("products", { query: "?select=*&order=created_at.asc" });
                    let nextProducts = dbProducts.map(productFromDb);
                    if (nextProducts.length === 0) {
                        const seededProducts = await supabaseRequest("products", { method: "POST", body: fallbackProducts.map(productToDb) });
                        nextProducts = seededProducts.map(productFromDb);
                    }
                    setProducts(nextProducts);

                    const dbCustomers = await supabaseRequest("customers", { query: "?select=*&order=created_at.asc" });
                    let nextCustomers = dbCustomers.map(customerFromDb);
                    if (nextCustomers.length === 0 && fallbackCustomers.length) {
                        const seededCustomers = await supabaseRequest("customers", {
                            method: "POST",
                            body: fallbackCustomers.map(customer => ({
                                name: customer.name,
                                phone: customer.phone,
                                points: customer.points || 0
                            }))
                        });
                        nextCustomers = seededCustomers.map(customerFromDb);
                    }
                    setCustomers(nextCustomers);

                    const dbPurchases = await supabaseRequest("purchase_records", { query: "?select=*&order=created_at.desc" });
                    setPurchaseRecords(dbPurchases.map(row => purchaseFromDb({ ...row, product_name: nextProducts.find(product => product.id === row.product_id)?.name })));

                    const dbEmployees = await supabaseRequest("employees", { query: "?select=*&order=created_at.asc" });
                    let nextEmployees = dbEmployees.map(employeeFromDb);
                    if (nextEmployees.length === 0) {
                        const seededEmployees = await supabaseRequest("employees", {
                            method: "POST",
                            body: employees.map(employee => ({
                                name: employee.name,
                                role: employee.role,
                                status: employee.status
                            }))
                        });
                        nextEmployees = seededEmployees.map(employeeFromDb);
                    }
                    setEmployees(nextEmployees);

                    const dbAttendance = await supabaseRequest("attendance_logs", { query: "?select=*&order=created_at.desc" });
                    setAttendanceLogs(dbAttendance.map(attendanceFromDb));

                    const dbOrders = await supabaseRequest("orders", { query: "?select=*&order=created_at.desc" });
                    const dbOrderItems = await supabaseRequest("order_items", { query: "?select=*&order=id.asc" });
                    const itemsByOrder = dbOrderItems.reduce((map, item) => {
                        map[item.order_id] = map[item.order_id] || [];
                        map[item.order_id].push({
                            id: item.product_id,
                            name: item.product_name,
                            price: item.unit_price || 0,
                            quantity: item.quantity || 0
                        });
                        return map;
                    }, {});
                    setHistoryRecords(dbOrders.map(order => ({
                        orderId: order.order_no,
                        time: order.created_at ? new Date(order.created_at).toLocaleString() : order.order_date,
                        dateKey: order.order_date,
                        items: itemsByOrder[order.id] || [],
                        subtotal: order.subtotal || 0,
                        discount: order.discount || 0,
                        total: order.total || 0,
                        paymentMethod: order.payment_method,
                        receivedAmount: order.received_amount || order.total || 0,
                        changeAmount: order.change_amount || 0,
                        invoiceType: order.invoice_type,
                        processedBy: order.processed_by,
                        member: nextCustomers.find(customer => customer.id === order.member_id) || null
                    })));
                };

                const saveOrderToSupabase = async (record, invoiceData) => {
                    if (!isSupabaseConfigured) return;
                    const [insertedOrder] = await supabaseRequest("orders", {
                        method: "POST",
                        body: [{
                            order_no: record.orderId,
                            order_date: record.dateKey,
                            subtotal: record.subtotal,
                            discount: record.discount,
                            total: record.total,
                            payment_method: record.paymentMethod,
                            received_amount: record.receivedAmount,
                            change_amount: record.changeAmount,
                            invoice_type: invoiceData.invoiceType,
                            donation_code: invoiceData.donationCode || null,
                            member_id: record.member?.id || null,
                            processed_by: record.processedBy
                        }]
                    });
                    if (record.items.length) {
                        await supabaseRequest("order_items", {
                            method: "POST",
                            body: record.items.map(item => ({
                                order_id: insertedOrder.id,
                                product_id: item.id,
                                product_name: item.name,
                                unit_price: item.price,
                                quantity: item.quantity,
                                line_total: item.price * item.quantity
                            }))
                        });
                    }
                    await Promise.all(record.items.map(item => {
                        const nextStock = Math.max(0, (products.find(product => product.id === item.id)?.stock || 0) - item.quantity);
                        return supabaseRequest("products", {
                            method: "PATCH",
                            query: `?id=eq.${item.id}`,
                            body: { stock: nextStock },
                            prefer: "return=minimal"
                        });
                    }));
                };

                useEffect(() => {
                    const initialProducts = products;
                    const initialCustomers = customers;
                    const loadData = async () => {
                        try {
                            const savedData = JSON.parse(localStorage.getItem(storageKey) || "{}");
                            if (Array.isArray(savedData.products)) setProducts(savedData.products);
                            if (Array.isArray(savedData.historyRecords)) setHistoryRecords(savedData.historyRecords);
                            if (Array.isArray(savedData.customers)) setCustomers(savedData.customers);
                            if (Array.isArray(savedData.purchaseRecords)) setPurchaseRecords(savedData.purchaseRecords);
                            if (Array.isArray(savedData.attendanceLogs)) setAttendanceLogs(savedData.attendanceLogs);
                            if (Array.isArray(savedData.employees)) setEmployees(savedData.employees);
                        } catch (error) {
                            console.warn("無法讀取本機儲存資料", error);
                        }

                        if (isSupabaseConfigured) {
                            try {
                                await loadSupabaseData(initialProducts, initialCustomers);
                            } catch (error) {
                                console.warn("Supabase 讀取失敗，已改用本機資料", error);
                                alert("Supabase 讀取失敗，系統暫時使用本機資料。請確認 anon key、資料表名稱與 RLS 權限。");
                            }
                        }
                        setIsStorageReady(true);
                    };
                    loadData();
                }, []);

                useEffect(() => {
                    if (!isStorageReady) return;
                    localStorage.setItem(storageKey, JSON.stringify({
                        products,
                        historyRecords,
                        customers,
                        purchaseRecords,
                        attendanceLogs,
                        employees
                    }));
                }, [isStorageReady, products, historyRecords, customers, purchaseRecords, attendanceLogs, employees]);

                const handleLogin = () => passwordInput === "1234" && currentUser ? setIsLoggedIn(true) : alert("請選擇使用者並輸入正確密碼");
                
                const handleLogout = () => {
                    setIsLoggedIn(false);
                    setCurrentUser(null);
                    setActiveView('pos');
                    setPasswordInput("");
                };

                const addNewCart = () => carts.length < 5 ? (setCarts([...carts, { id: Date.now(), name: `購物車 ${carts.length + 1}`, items: [], discount: 0, pointsRedeemed: 0, selectedMember: null }]), setActiveCartIndex(carts.length)) : alert("最多開啟 5 個購物車視窗");
                
                const filteredProducts = useMemo(() => products.filter(p => (selectedCategory === "全部" || p.category === selectedCategory) && p.name.toLowerCase().includes(searchQuery.toLowerCase())), [products, selectedCategory, searchQuery]);
                const filteredMembers = useMemo(() => customers.filter(c => c.name.includes(memberSearchQuery) || c.phone.includes(memberSearchQuery)), [customers, memberSearchQuery]);

                const currentCart = carts[activeCartIndex];
                const subtotal = currentCart.items.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                const totalBeforePoints = Math.max(0, subtotal - currentCart.discount);
                const pointsRedeemed = Math.min(currentCart.pointsRedeemed || 0, totalBeforePoints, currentCart.selectedMember?.points || 0);
                const total = Math.max(0, totalBeforePoints - pointsRedeemed);
                const dashboardStats = useMemo(() => {
                    const todayKey = new Date().toLocaleDateString("sv-SE");
                    const totalRevenue = historyRecords.reduce((sum, record) => sum + record.total, 0);
                    const dailyRevenue = historyRecords.reduce((sum, record) => {
                        const recordDateKey = record.dateKey || new Date(record.time).toLocaleDateString("sv-SE");
                        return recordDateKey === todayKey ? sum + record.total : sum;
                    }, 0);
                    const averageOrderValue = historyRecords.length ? Math.round(totalRevenue / historyRecords.length) : 0;
                    const productSalesMap = products.reduce((map, product) => {
                        map[product.id] = { ...product, soldQty: 0, salesAmount: 0, abcClass: "C", cumulativeRate: 0 };
                        return map;
                    }, {});

                    historyRecords.forEach(record => {
                        record.items.forEach(item => {
                            if (!productSalesMap[item.id]) {
                                productSalesMap[item.id] = { ...item, stock: 0, soldQty: 0, salesAmount: 0, abcClass: "C", cumulativeRate: 0 };
                            }
                            productSalesMap[item.id].soldQty += item.quantity;
                            productSalesMap[item.id].salesAmount += item.price * item.quantity;
                        });
                    });

                    const sortedProducts = Object.values(productSalesMap).sort((a, b) => b.salesAmount - a.salesAmount);
                    let cumulativeSales = 0;
                    const classifiedProducts = sortedProducts.map(product => {
                        const cumulativeRateBefore = totalRevenue ? cumulativeSales / totalRevenue : 0;
                        cumulativeSales += product.salesAmount;
                        const cumulativeRate = totalRevenue ? cumulativeSales / totalRevenue : 0;
                        const abcClass = !totalRevenue || product.salesAmount === 0 ? "C" : cumulativeRateBefore < 0.7 ? "A" : cumulativeRateBefore < 0.9 ? "B" : "C";
                        return { ...product, cumulativeRate, abcClass };
                    });

                    const classCounts = classifiedProducts.reduce((acc, product) => {
                        acc[product.abcClass] += 1;
                        return acc;
                    }, { A: 0, B: 0, C: 0 });

                    return { totalRevenue, dailyRevenue, averageOrderValue, classifiedProducts, classCounts, orderCount: historyRecords.length };
                }, [historyRecords, products]);

                const smartSuggestions = useMemo(() => {
                    const activeItems = dashboardStats.classifiedProducts.filter(p => p.soldQty > 0);
                    const restockItems = dashboardStats.classifiedProducts
                        .filter(p => p.soldQty > 0 && (p.stock <= 10 || (p.abcClass === "A" && p.stock <= 15)))
                        .sort((a, b) => (b.salesAmount - a.salesAmount) || (a.stock - b.stock));
                    const promoItems = dashboardStats.classifiedProducts
                        .filter(p => p.stock >= 20 && (p.soldQty === 0 || p.abcClass === "C"))
                        .sort((a, b) => b.stock - a.stock);
                    const watchItems = dashboardStats.classifiedProducts
                        .filter(p => p.soldQty > 0 && p.stock > 10)
                        .sort((a, b) => b.salesAmount - a.salesAmount);
                    const suggestions = [];

                    if (!dashboardStats.orderCount) {
                        return [{ title: "先累積銷售資料", detail: "目前尚無交易紀錄。完成幾筆結帳後，系統會自動整理補貨、促銷與陳列建議。" }];
                    }
                    if (restockItems.length) {
                        suggestions.push({ title: "建議補貨商品", detail: `${restockItems.slice(0, 4).map(p => `${p.name}（庫存 ${p.stock}）`).join("、")}。這些商品已有銷售表現且庫存偏低，建議優先安排進貨。` });
                    } else if (activeItems.length) {
                        suggestions.push({ title: "目前暫無急迫補貨", detail: "有銷售紀錄的商品庫存仍可支撐短期販售，建議持續觀察熱銷品庫存變化。" });
                    }
                    if (promoItems.length) {
                        suggestions.push({ title: "建議促銷商品", detail: `${promoItems.slice(0, 4).map(p => `${p.name}（庫存 ${p.stock}）`).join("、")}。這些商品庫存較高或銷售速度較慢，適合規劃折扣、會員優惠或組合銷售。` });
                    } else {
                        suggestions.push({ title: "目前暫無明顯促銷壓力", detail: "高庫存且低銷售的商品不多，可先把促銷資源集中在新品曝光或會員回購。" });
                    }
                    if (watchItems.length) {
                        suggestions.push({ title: "陳列與販售重點", detail: `${watchItems.slice(0, 3).map(p => p.name).join("、")} 已有銷售動能，建議放在門市醒目位置或收銀加購區。` });
                    }

                    return suggestions;
                }, [dashboardStats]);

                const filteredAbcProducts = useMemo(() => {
                    if (selectedAbcClass === "全部") return dashboardStats.classifiedProducts;
                    return dashboardStats.classifiedProducts.filter(product => product.abcClass === selectedAbcClass);
                }, [dashboardStats, selectedAbcClass]);

                const addToCart = (product) => setCarts(prev => prev.map((c, i) => i === activeCartIndex ? { ...c, items: c.items.find(it => it.id === product.id) ? c.items.map(it => it.id === product.id ? { ...it, quantity: it.quantity + 1 } : it) : [...c.items, { ...product, quantity: 1 }] } : c));
                const updateQuantity = (id, delta) => setCarts(prev => prev.map((c, i) => i === activeCartIndex ? { ...c, items: c.items.map(it => it.id === id ? { ...it, quantity: it.quantity + delta } : it).filter(it => it.quantity > 0) } : c));
                const setMemberForCurrentCart = (member) => setCarts(prev => prev.map((c, i) => i === activeCartIndex ? { ...c, selectedMember: member, pointsRedeemed: 0 } : c));
                const clearMemberForCurrentCart = () => setCarts(prev => prev.map((c, i) => i === activeCartIndex ? { ...c, selectedMember: null, pointsRedeemed: 0 } : c));

                const handleApplyPoints = () => {
                    if (!currentCart.selectedMember) return;
                    const availablePoints = currentCart.selectedMember.points || 0;
                    const requestedPoints = Math.max(0, Math.floor(Number(redeemPointsInput) || 0));
                    const maxRedeemable = Math.min(availablePoints, totalBeforePoints);
                    const appliedPoints = Math.min(requestedPoints, maxRedeemable);
                    setCarts(prev => prev.map((c, i) => i === activeCartIndex ? { ...c, pointsRedeemed: appliedPoints } : c));
                    setRedeemPointsInput("");
                    setIsPointsModalOpen(false);
                };

                // 發票與交易完成邏輯
                const handleInitiateTransaction = (method) => { 
                    setTempTransactionData({ method }); 
                    setIsCheckingOut(false);
                    if (method === '現金') {
                        setReceivedAmount("");
                        setIsCashPaymentModalOpen(true);
                    } else {
                        setIsInvoiceModalOpen(true); 
                    }
                };

                const handleConfirmCash = () => {
                    if (Number(receivedAmount) < total) {
                        alert("收受金額不足！");
                        return;
                    }
                    setIsCashPaymentModalOpen(false);
                    setIsInvoiceModalOpen(true);
                };

                const stopCamera = () => {
                    if (cameraStreamRef.current) {
                        cameraStreamRef.current.getTracks().forEach(track => track.stop());
                        cameraStreamRef.current = null;
                    }
                };

                useEffect(() => {
                    if (!scannerModal) {
                        stopCamera();
                        return;
                    }
                    setCameraError("");
                    if (!navigator.mediaDevices?.getUserMedia) {
                        setCameraError("此裝置或瀏覽器不支援開啟攝影機");
                        return;
                    }
                    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                        .then(stream => {
                            cameraStreamRef.current = stream;
                            if (videoRef.current) videoRef.current.srcObject = stream;
                        })
                        .catch(() => setCameraError("無法開啟攝影機，請確認瀏覽器權限"));
                    return stopCamera;
                }, [scannerModal]);

                const finalizeTransaction = (invoiceData = { invoiceType: "不開發票" }) => {
                    const processedByName = currentUser ? currentUser.name : "未知使用者";
                    const displayInvoiceType = invoiceData.donationCode ? `${invoiceData.invoiceType} (${invoiceData.donationCode})` : invoiceData.invoiceType;
                    const usedPoints = currentCart.selectedMember ? pointsRedeemed : 0;
                    const earnedPoints = currentCart.selectedMember ? Math.floor(total / 100) : 0;
                    const updatedMember = currentCart.selectedMember ? {
                        ...currentCart.selectedMember,
                        points: Math.max(0, (currentCart.selectedMember.points || 0) - usedPoints) + earnedPoints
                    } : null;
                    const newRecord = { 
                        orderId: `ORD-${Date.now()}`, 
                        time: new Date().toLocaleString(), 
                        dateKey: new Date().toLocaleDateString("sv-SE"),
                        items: JSON.parse(JSON.stringify(currentCart.items)), 
                        subtotal, 
                        discount: currentCart.discount, 
                        total, 
                        paymentMethod: tempTransactionData.method, 
                        receivedAmount: tempTransactionData.method === '現金' ? Number(receivedAmount) : total,
                        changeAmount: tempTransactionData.method === '現金' ? (Number(receivedAmount) - total) : 0,
                        invoiceType: displayInvoiceType, 
                        pointsRedeemed: usedPoints,
                        pointsEarned: earnedPoints,
                        processedBy: processedByName, 
                        member: updatedMember 
                    };
                    setHistoryRecords([newRecord, ...historyRecords]);
                    if (updatedMember) {
                        setCustomers(prev => prev.map(customer => customer.id === updatedMember.id ? updatedMember : customer));
                        if (isSupabaseConfigured) {
                            supabaseRequest("customers", {
                                method: "PATCH",
                                query: `?id=eq.${updatedMember.id}`,
                                body: { points: updatedMember.points },
                                prefer: "return=minimal"
                            }).catch(error => console.warn("Supabase 會員點數更新失敗", error));
                        }
                    }
                    setProducts(prev => prev.map(p => { const ci = currentCart.items.find(x => x.id === p.id); return ci ? { ...p, stock: p.stock - ci.quantity } : p; }));
                    saveOrderToSupabase(newRecord, invoiceData).catch(error => {
                        console.warn("Supabase 訂單寫入失敗", error);
                        alert("交易已保存在本機，但 Supabase 寫入失敗。請確認 anon key、RLS 與欄位名稱。");
                    });
                    setCarts(prev => prev.map((c, i) => i === activeCartIndex ? { ...c, items: [], discount: 0, pointsRedeemed: 0, selectedMember: null } : c));
                    setIsInvoiceModalOpen(false);
                    setIsDonationModalOpen(false);
                    setScannerModal(null);
                    setInfoModal(null);
                    setPendingInvoiceData(null);
                    setDonationCode("");
                    setTempTransactionData(null);
                    stopCamera();
                };

                const proceedPaymentAfterInvoice = (invoiceData) => {
                    setPendingInvoiceData(invoiceData);
                    if (tempTransactionData.method === "信用卡" || tempTransactionData.method === "APPLE PAY") {
                        setInfoModal({ message: "請依刷卡機上指示操作", nextStep: "finalize" });
                    } else if (tempTransactionData.method === "LINE PAY") {
                        setScannerModal({ type: "linePay", title: "掃描 LINE PAY 條碼", description: "請將顧客手機上的 LINE PAY 條碼對準鏡頭", nextStep: "finalize" });
                    } else {
                        finalizeTransaction(invoiceData);
                    }
                };

                const handleInvoiceSelected = (invoiceType) => {
                    const invoiceData = { invoiceType };
                    setIsInvoiceModalOpen(false);
                    if (invoiceType === "電子發票") {
                        setPendingInvoiceData(invoiceData);
                        setInfoModal({ message: "發票已列印", nextStep: "payment" });
                    } else if (invoiceType === "雲端載具") {
                        setPendingInvoiceData(invoiceData);
                        setScannerModal({ type: "carrier", title: "掃描雲端載具條碼", description: "請將會員手機載具條碼對準鏡頭", nextStep: "carrierDone" });
                    } else if (invoiceType === "捐贈發票") {
                        setDonationCode("");
                        setIsDonationModalOpen(true);
                    } else {
                        proceedPaymentAfterInvoice(invoiceData);
                    }
                };

                const handleDonationConfirm = () => {
                    if (!donationCode.trim()) {
                        alert("請輸入捐贈碼");
                        return;
                    }
                    const invoiceData = { invoiceType: "捐贈發票", donationCode: donationCode.trim() };
                    setIsDonationModalOpen(false);
                    proceedPaymentAfterInvoice(invoiceData);
                };

                const handleScannerComplete = () => {
                    if (!scannerModal) return;
                    stopCamera();
                    if (scannerModal.nextStep === "carrierDone") {
                        setScannerModal(null);
                        setInfoModal({ message: "發票已存入載具", nextStep: "payment" });
                    } else {
                        setScannerModal(null);
                        finalizeTransaction(pendingInvoiceData);
                    }
                };

                const handleInfoConfirm = () => {
                    const nextStep = infoModal?.nextStep;
                    setInfoModal(null);
                    if (nextStep === "payment") proceedPaymentAfterInvoice(pendingInvoiceData);
                    if (nextStep === "finalize") finalizeTransaction(pendingInvoiceData);
                };

                const handleClockAction = (empId, type) => {
                    const time = new Date().toLocaleString();
                    const emp = employees.find(e => e.id === empId);
                    const nextStatus = type === 'in' ? 'online' : 'offline';
                    const log = { id: Date.now(), name: emp.name, time, type: type === 'in' ? '上班' : '下班' };
                    setAttendanceLogs(prev => [log, ...prev]);
                    setEmployees(prev => prev.map(e => e.id === empId ? { ...e, status: nextStatus } : e));
                    if (isSupabaseConfigured) {
                        supabaseRequest("attendance_logs", {
                            method: "POST",
                            body: [{ employee_name: emp.name, action: log.type }]
                        }).catch(error => console.warn("Supabase 打卡寫入失敗", error));
                        supabaseRequest("employees", {
                            method: "PATCH",
                            query: `?id=eq.${empId}`,
                            body: { status: nextStatus },
                            prefer: "return=minimal"
                        }).catch(error => console.warn("Supabase 員工狀態更新失敗", error));
                    }
                };

                const handleAddCustomer = () => {
                    if (!newCustName) return;
                    const localCustomer = { id: `C${Date.now().toString().slice(-4)}`, name: newCustName, phone: newCustPhone, points: 0 };
                    setCustomers([localCustomer, ...customers]);
                    if (isSupabaseConfigured) {
                        supabaseRequest("customers", {
                            method: "POST",
                            body: [{ name: newCustName, phone: newCustPhone, points: 0 }]
                        }).then(rows => {
                            const savedCustomer = customerFromDb(rows[0]);
                            setCustomers(prev => prev.map(customer => customer.id === localCustomer.id ? savedCustomer : customer));
                        }).catch(error => console.warn("Supabase 會員寫入失敗", error));
                    }
                    setNewCustName("");
                    setNewCustPhone("");
                };

                const handleScroll = () => {
                    if (!scrollContainerRef.current) return;
                    if (scrollContainerRef.current.scrollTop > 20 && !isCategoriesCollapsed) setIsCategoriesCollapsed(true);
                    else if (scrollContainerRef.current.scrollTop <= 20 && isCategoriesCollapsed) setIsCategoriesCollapsed(false);

                        )}

                        {isPointsModalOpen && (
                            <div className="fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center z-[116] p-4 text-center">
                                <div className="bg-white rounded-[40px] w-full max-w-sm overflow-hidden shadow-2xl p-10 animate-in zoom-in duration-300">
                                    <h2 className="text-2xl font-black mb-4 text-gray-800">會員點數折抵</h2>
                                    <p className="text-sm text-gray-400 font-bold mb-8">可用 {currentCart.selectedMember?.points || 0} P，1 點折抵 NT$1<br/>本次消費每 NT$100 累積 1 點</p>
                                    <div className="relative mb-8"><span className="absolute right-6 top-1/2 -translate-y-1/2 text-2xl font-black text-gray-300">P</span><input type="number" autoFocus className="w-full h-20 bg-amber-50 border-2 border-amber-100 rounded-3xl px-8 text-3xl font-black outline-none focus:border-amber-400 text-center" value={redeemPointsInput} onChange={(e) => setRedeemPointsInput(e.target.value)} placeholder="0" /></div>
                                    <div className="grid grid-cols-2 gap-4"><button onClick={() => { setCarts(prev => prev.map((c, i) => i === activeCartIndex ? { ...c, pointsRedeemed: 0 } : c)); setIsPointsModalOpen(false); }} className="py-4 bg-gray-100 text-gray-500 rounded-2xl font-black">移除</button><button onClick={handleApplyPoints} className="py-4 bg-[#59B88D] text-white rounded-2xl font-black shadow-lg">確認套用</button></div>
                                </div>
                            </div>
                        )}

                        {isAddPurchaseModalOpen && (
                            <div className="fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center z-[140] p-4 text-left">
                                <div className="bg-white rounded-[40px] w-full max-w-md shadow-2xl p-10 animate-in zoom-in duration-300">
                                    <div className="flex justify-between items-center mb-8"><h2 className="text-2xl font-black text-gray-800">新增進貨單</h2><button onClick={()=>setIsAddPurchaseModalOpen(false)} className="p-2 hover:bg-gray-100 rounded-full transition-colors"><Icon name="X"/></button></div>
                                    <div className="space-y-4">
                                        <select className="w-full bg-gray-50 border-2 border-gray-100 rounded-2xl px-5 py-4 outline-none focus:border-[#59B88D] font-bold text-gray-700" value={newPurchase.productId} onChange={e=>setNewPurchase({...newPurchase, productId: e.target.value})}><option value="">-- 請選擇商品 --</option>{products.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}</select>
                                        <input placeholder="供應商名稱" className="w-full bg-gray-50 border-2 border-gray-100 rounded-2xl px-5 py-4 outline-none focus:border-[#59B88D] font-bold text-gray-700" value={newPurchase.supplier} onChange={e=>setNewPurchase({...newPurchase, supplier: e.target.value})} />
                                        <div className="grid grid-cols-2 gap-4"><input type="number" placeholder="進貨單價" className="w-full bg-gray-50 border-2 border-gray-100 rounded-2xl px-5 py-4 outline-none focus:border-[#59B88D] font-bold text-gray-700 text-center" value={newPurchase.unitPrice} onChange={e=>setNewPurchase({...newPurchase, unitPrice: e.target.value})} /><input type="number" placeholder="進貨數量" className="w-full bg-gray-50 border-2 border-gray-100 rounded-2xl px-5 py-4 outline-none focus:border-[#59B88D] font-bold text-gray-700 text-center" value={newPurchase.quantity} onChange={e=>setNewPurchase({...newPurchase, quantity: e.target.value})} /></div>
                                        <div className="pt-4 border-t border-gray-50 flex justify-between items-center mb-6 px-1"><span className="text-gray-400 font-bold text-xs uppercase">預估進貨總額</span><span className="text-2xl font-black text-[#59B88D]">${((parseInt(newPurchase.unitPrice)||0) * (parseInt(newPurchase.quantity)||0)).toLocaleString()}</span></div>
                                        <button onClick={handleAddPurchase} className="w-full py-4.5 bg-[#59B88D] text-white font-black rounded-2xl shadow-lg">確認提交進貨單</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        })();
    </script>
</body>
</html>
